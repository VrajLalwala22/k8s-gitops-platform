apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasks-k3s
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VrajLalwala22/k8s-gitops-platform.git
    targetRevision: main
    path: k8s/overlays/k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: tasks
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
