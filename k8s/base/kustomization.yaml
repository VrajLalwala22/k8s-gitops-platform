apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tasks

labels:
  - pairs:
      app.kubernetes.io/part-of: tasks-platform
    includeSelectors: false

resources:
  - namespace.yaml
  - api-serviceaccount.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - api-pdb.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: api-config
    literals:
      - APP_VERSION=0.1.0

# The Deployment references the logical image name "tasks-api";
# each overlay maps it to a real registry and tag with an `images:` entry.
