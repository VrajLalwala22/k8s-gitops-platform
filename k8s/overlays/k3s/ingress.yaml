apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasks-api
  namespace: tasks
spec:
  ingressClassName: traefik
  rules:
    - host: tasks.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tasks-api
                port:
                  name: http
