# Applied after kube-prometheus-stack is installed (it provides these CRDs).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tasks-api
  namespace: tasks
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tasks-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tasks-api-alerts
  namespace: tasks
spec:
  groups:
    - name: tasks-api
      rules:
        - alert: TasksApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="tasks", status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="tasks"}[5m])), 1e-9) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: More than 5% of Tasks API requests are failing.
        - alert: TasksApiHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="tasks"}[5m]))) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Tasks API p95 latency is above 500ms.
        - alert: TasksApiPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="tasks"}[15m]) > 3
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} restarted more than 3 times in 15 minutes."
