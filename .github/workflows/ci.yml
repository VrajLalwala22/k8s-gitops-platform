name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: pytest -q

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render and validate overlays
        run: |
          for overlay in k3s eks; do
            echo "::group::$overlay"
            kubectl kustomize "k8s/overlays/$overlay" | kubeconform -strict -summary -kubernetes-version 1.31.0
            echo "::endgroup::"
          done

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, eks, k3s-ec2]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  image:
    name: Build, scan and push image
    needs: [test, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: tasks-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        # Pinned to a commit SHA (v0.36.0): this action's tags were rewritten in 2026,
        # so a tag alone is not a stable or trustworthy reference.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tasks-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push to GHCR
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/tasks-api
          docker tag tasks-api:scan "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"

  promote:
    name: Promote image to EKS overlay (GitOps)
    needs: [image, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pin the new image tag in Git
        run: |
          yq -i '(.images[] | select(.name == "tasks-api")).newTag = "${{ github.sha }}"' k8s/overlays/eks/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(eks): tasks-api ${{ github.sha }} [skip ci]" || echo "No change"
          git push
